<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Безкоштовний інтернет</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Чистий чорний фон */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Контейнер, який вирівнює текст і картинку по вертикалі */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 100%;
        }

        /* Стилі для твого нового напису */
        .promo-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: scale(0);
            /* Текст з'являється одночасно з мавпою */
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        img {
            max-width: 95%; 
            max-height: 80vh; /* Трохи зменшили висоту, щоб текст точно поміщався зверху на смартфонах */
            object-fit: contain;
            display: block;
            transform: scale(0);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="promo-text">Ось ваш інтернет:</div>
        <img src="monkey.jpg" alt="">
    </div>

</body>
</html>
