<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> </title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 95%;
            max-height: 95vh;
            object-fit: contain;
            display: block;
            transform: scale(0);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Звук пердежа (загружается автоматически) -->
    <audio id="fartAudio" autoplay>
        <source src="https://soundjay.com" type="audio/mpeg">
    </audio>

    <img src="monkey.jpg" alt="">

    <script>
        // Современные браузеры блокируют автозвук без клика. 
        // Этот скрипт включит звук в секунду, как пользователь хоть где-то коснется экрана.
        window.addEventListener('touchstart', function() {
            var audio = document.getElementById('fartAudio');
            audio.play();
        });
        window.addEventListener('click', function() {
            var audio = document.getElementById('fartAudio');
            audio.play();
        });
    </script>

</body>
</html>
