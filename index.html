<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> </title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Растягивает фото на весь экран смартфона без полей */
            display: block;
            transform: scale(0);
            animation: popUp 0.3s ease-out forwards;
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <img src="monkey.jpg" alt="">

</body>
</html>
