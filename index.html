<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> </title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Черный фон вокруг */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 95%; /* Не дает картинке вылазить по ширине */
            max-height: 95vh; /* Не дает вылазить по высоте */
            object-fit: contain; /* Картинка сжимается и видна ПОЛНОСТЬЮ */
            display: block;
            transform: scale(0);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <img src="monkey.jpg" alt="">

</body>
</html>
