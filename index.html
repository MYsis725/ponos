<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Привіт від мавпи!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        .container {
            text-align: center;
        }
        img {
            max-width: 90%;
            max-height: 70vh;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            transform: scale(0);
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
        h1 {
            color: white;
            margin-top: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="monkey.jpg" alt="Мавпа">
    <h1>Сюрприз! 🐒🖕</h1>
</div>

</body>
</html>
