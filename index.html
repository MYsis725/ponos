<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Безкоштовний інтернет</title>
    
    <!-- Вот эта строчка добавляет иконку Wi-Fi на вкладку сайта -->
    <link rel="icon" type="image/png" href="https://icons8.com">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Чистый черный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Контейнер, который выравнивает текст и картинку по вертикали */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-height: 100%;
        }

        /* Стили для твоего нового надписи */
        .promo-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: scale(0);
            /* Текст появляется одновременно с обезьяной */
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        img {
            max-width: 95%; 
            max-height: 80vh; /* Немного уменьшили высоту, чтобы текст точно помещался сверху на смартфонах */
            object-fit: contain;
            display: block;
            transform: scale(0);
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
