<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вхід до безкоштовної Wi-Fi мережі</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
        }
        
        #wifi-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.2s ease;
        }
        .wifi-icon {
            font-size: 64px;
            color: #007aff;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h2 {
            font-size: 22px;
            color: #333;
            margin: 0 0 10px 0;
            text-align: center;
        }
        p {
            font-size: 14px;
            color: #666;
            margin: 0 0 30px 0;
            text-align: center;
        }
        .btn-connect {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            width: 100%;
            max-width: 280px;
            transition: background-color 0.1s;
        }
        .btn-connect:active {
            background-color: #0056b3;
        }

        #monkey-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            visibility: hidden;
        }
        img {
            max-width: 95%;
            max-height: 95vh;
            object-fit: contain;
            display: block;
            transform: scale(0);
        }
        .show-monkey img {
            animation: popUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ФЕЙК ВАЙФАЙ -->
    <div id="wifi-screen">
        <div class="wifi-icon">📶</div>
        <h2>Безкоштовний Wi-Fi</h2>
        <p>Для отримання доступу до швидкісного інтернету натисніть кнопку нижче.</p>
        <button class="btn-connect" onclick="startPrank()">ПІДКЛЮЧИТИСЯ</button>
    </div>

    <!-- ЭКРАН 2: ОГРОМНАЯ ГОРИЛЛА -->
    <div id="monkey-screen">
        <img src="monkey.jpg" alt="">
    </div>

    <!-- Аудиоэффект пердежа (теперь берется прямо из репозитория) -->
    <audio id="fartAudio" preload="auto">
        <source src="fart.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startPrank() {
            // 1. Включаем звук пука
            var audio = document.getElementById('fartAudio');
            audio.play().catch(function(error) {
                console.log("Ошибка воспроизведения звука:", error);
            });

            // 2. Скрываем экран Wi-Fi
            document.getElementById('wifi-screen').style.display = 'none';

            // 3. Показываем экран с гориллой и запускаем анимацию вылета
            var monkeyScreen = document.getElementById('monkey-screen');
            monkeyScreen.style.visibility = 'visible';
            monkeyScreen.classList.add('show-monkey');
        }
    </script>

</body>
</html>
