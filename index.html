<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Безкоштовний інтернет</title>
    
    <!-- Пряме посилання на білу іконку Wi-Fi для вкладки -->
    <link rel="icon" type="image/svg+xml" href="https://githubusercontent.com">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* Чистий чорний фон */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Контейнер, який вирівнює текст і картинку по вертикалі */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transform: scale(0);
            /* Увесь контент з'являється плавно разом */
            animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Стилі для твого напису */
        .promo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        img {
            max-width: 95%; 
            max-height: 75vh; /* Зменшено висоту, щоб текст точно поміщався зверху на смартфонах */
            object-fit: contain;
            display: block;
        }

        @keyframes popUp {
            to { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <div class="promo-text">Ось ваш інтернет:</div>
        <img src="monkey.jpg" alt="Мавпа">
    </div>

</body>
</html>
